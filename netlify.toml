[build]
  base    = "frontend"
  command = "npm run build"
  publish = ".next"

# 빌드타임 공개 환경변수 (NEXT_PUBLIC_*는 클라이언트 번들에 인라인되는 공개값 — 시크릿 아님).
# repo에 고정해 재현 가능한 배포를 보장한다. 진짜 시크릿(SUPABASE_SERVICE_KEY 등)은 절대 여기 두지 않는다.
[build.environment]
  NEXT_PUBLIC_SUPABASE_URL             = "https://toptwnqbqrqefhlbeelb.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_A7GIPP9C8-wehrANAm_Xcg_mTLbfDpi"
  NEXT_PUBLIC_API_URL                  = "https://meetinghub-ai.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"
