{% extends "layouts/base.html" %}
{% block title %}회의록 작성 - MeetingHub AI{% endblock %}
{% block heading %}회의록 작성{% endblock %}
{% block content %}
<section class="form-panel wide">
  <form>
    <label>회의 목적<input type="text" name="purpose" placeholder="MVP API 설계 확정"></label>
    <label>회의 내용<textarea name="content" rows="7"></textarea></label>
    <label>논의 사항<textarea name="discussion" rows="4"></textarea></label>
    <label>결정 사항<textarea name="decisions" rows="4"></textarea></label>
    <label>메모<textarea name="memo" rows="3"></textarea></label>
    <button class="button" type="submit">저장 및 AI 분석</button>
  </form>
</section>
{% endblock %}
