{% extends "layouts/base.html" %}
{% block title %}직원 초대 - MeetingHub AI{% endblock %}
{% block heading %}직원 초대{% endblock %}
{% block content %}
<section class="form-panel">
  <form>
    <label>이름<input type="text" name="name" placeholder="홍길동"></label>
    <label>이메일<input type="email" name="email" placeholder="hong@test.com"></label>
    <label>부서<input type="text" name="department" placeholder="개발팀"></label>
    <label>직급<input type="text" name="position" placeholder="대리"></label>
    <label>권한<select name="role"><option>일반 사용자</option><option>Company Admin</option></select></label>
    <button class="button" type="submit">초대 발송</button>
  </form>
</section>
{% endblock %}
